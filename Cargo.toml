[package]
name = "airnope"
version = "0.0.1"
edition = "2021"

[dependencies]
acap = "0.4.0"
actix-web = "4.13.0"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
env_logger = "0.11.10"
futures = "0.3.32"
log = "0.4.29"
moka = { version = "0.12.15", features = ["future"] }
rand = "0.10.1"
rayon = "1.12.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["gzip", "json"] }
rust-bert = { version = "0.23.0", features = ["download-libtorch"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "fs", "rt"] }
walkdir = "2.5.0"

# See https://github.com/guillaume-be/rust-bert/issues/486
console = { version = "0.16.1", features = ["std"] }

[profile.release]
lto = true

[dev-dependencies]
md5 = "0.8.0"
